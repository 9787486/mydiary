<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFB5C8">
<title>나만의 다이어리</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════ */
:root{
  --pink:#FF8FAB;  --lpink:#FFD6E2; --dpink:#C84060;
  --lav:#C3A4FF;   --dlav:#7040C0;
  --mint:#5ED9B8;  --dmint:#1E9C78;
  --sky:#6EC9F5;   --dsky:#2888B8;
  --peach:#FFB07A; --dpeach:#C05820;
  --yel:#FFE040;   --dyel:#B09000;
  --coral:#FF7C6E; --dcoral:#C04030;
  --text:#3D2B4A;  --textm:#7A6090; --textl:#B0A0C4;
  --bg:#FFFBF4;    --paper:#FFF7EE;
  --r:18px; --rb:26px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Jua',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(circle,#E8D8FF 1.2px,transparent 1.2px);
  background-size:22px 22px;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ══════════════════════════════════════
   PAGES
══════════════════════════════════════ */
.page{display:none;min-height:100vh;padding-bottom:90px;animation:fadeUp .28s cubic-bezier(.34,1.4,.64,1)}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ══════════════════════════════════════
   HOME HEADER
══════════════════════════════════════ */
.home-hd{
  background:linear-gradient(150deg,#FFB5C8 0%,#C9B1FF 38%,#90D9FF 70%,#7EEFD4 100%);
  padding:52px 20px 28px;
  position:relative;
  overflow:hidden;
  border-radius:0 0 36px 36px;
}
.hd-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hd-star{position:absolute;animation:twk 2.5s ease-in-out infinite;opacity:.65}
.hd-star:nth-child(1){font-size:20px;top:14%;left:7%}
.hd-star:nth-child(2){font-size:16px;top:18%;right:9%;animation-delay:.7s}
.hd-star:nth-child(3){font-size:13px;bottom:24%;left:14%;animation-delay:1.2s}
.hd-star:nth-child(4){font-size:19px;bottom:18%;right:16%;animation-delay:.4s}
@keyframes twk{0%,100%{transform:scale(1) rotate(0deg);opacity:.65}50%{transform:scale(1.35) rotate(18deg);opacity:1}}

.hd-greeting{font-family:'Gaegu',sans-serif;font-weight:700;font-size:13px;color:rgba(61,43,74,.65);margin-bottom:2px}
.hd-title{font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.13);margin-bottom:10px;line-height:1.2}
.hd-datetime{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dt-badge{background:rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:20px;padding:5px 12px;font-size:12px;color:#fff;font-family:'Gaegu',sans-serif;font-weight:700;border:1px solid rgba(255,255,255,.35)}
.hd-mood-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border-radius:18px;padding:10px 14px;border:1.5px solid rgba(255,255,255,.85)}
.hd-mood-lbl{font-size:12px;color:var(--textm);flex-shrink:0}
.hd-moods{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hm-btn{background:none;border:2px solid transparent;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0;transition:all .2s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center}
.hm-btn.sel{border-color:var(--pink);background:var(--lpink);transform:scale(1.25)}

/* ══════════════════════════════════════
   PAGE HEADER (inner pages)
══════════════════════════════════════ */
.phd{padding:50px 20px 24px;position:relative;overflow:hidden;border-radius:0 0 30px 30px}
.phd-back{background:none;border:none;color:#fff;font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:9px;padding:0;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.phd-title{font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.12);margin-bottom:2px}
.phd-sub{font-size:12px;color:rgba(255,255,255,.85);font-family:'Gaegu',sans-serif;font-weight:700}
.phd-deco{position:absolute;font-size:80px;opacity:.11;right:-8px;bottom:-12px;transform:rotate(15deg);line-height:1}
.phd-sky   {background:linear-gradient(145deg,#6EC9F5,#4AB0E0);box-shadow:0 5px 0 var(--dsky)}
.phd-yel   {background:linear-gradient(145deg,#FFE040,#FFCC00);box-shadow:0 5px 0 var(--dyel)}
.phd-peach {background:linear-gradient(145deg,#FFB07A,#FF8C4A);box-shadow:0 5px 0 var(--dpeach)}
.phd-lav   {background:linear-gradient(145deg,#C3A4FF,#FF8FAB);box-shadow:0 5px 0 #9040B0}

/* ══════════════════════════════════════
   SECTION LABEL
══════════════════════════════════════ */
.sec{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin:16px 0 10px}
.sec::before,.sec::after{content:'';flex:1;height:2px}
.sec::before{background:linear-gradient(90deg,transparent,var(--lpink))}
.sec::after{background:linear-gradient(90deg,var(--lpink),transparent)}

/* ══════════════════════════════════════
   CARDS
══════════════════════════════════════ */
.ct{padding:14px 16px 8px}
.card{
  background:#fff;border-radius:var(--rb);padding:16px;margin-bottom:12px;
  border:2.5px solid var(--lpink);
  box-shadow:0 5px 0 #FFD6E2,0 8px 22px rgba(255,143,171,.1);
  position:relative;
}
.card::before{
  content:'';position:absolute;top:-6px;right:22px;
  width:44px;height:13px;border-radius:3px;transform:rotate(-2deg);
  background:repeating-linear-gradient(90deg,rgba(255,143,171,.4) 0,rgba(255,143,171,.4) 8px,rgba(255,210,220,.4) 8px,rgba(255,210,220,.4) 16px);
}
.card-sky  {border-color:#C0E8FF;box-shadow:0 5px 0 #C0E8FF,0 8px 22px rgba(110,201,245,.1)}
.card-sky::before{background:repeating-linear-gradient(90deg,rgba(110,201,245,.4) 0,rgba(110,201,245,.4) 8px,rgba(160,220,255,.4) 8px,rgba(160,220,255,.4) 16px)}
.card-yel  {border-color:#FFE899;box-shadow:0 5px 0 #FFE899,0 8px 22px rgba(255,204,0,.1)}
.card-yel::before{background:repeating-linear-gradient(90deg,rgba(255,224,64,.5) 0,rgba(255,224,64,.5) 8px,rgba(255,240,120,.5) 8px,rgba(255,240,120,.5) 16px)}
.card-lav  {border-color:#DFD0FF;box-shadow:0 5px 0 #DFD0FF,0 8px 22px rgba(195,164,255,.1)}
.card-lav::before{background:repeating-linear-gradient(90deg,rgba(195,164,255,.4) 0,rgba(195,164,255,.4) 8px,rgba(220,200,255,.4) 8px,rgba(220,200,255,.4) 16px)}
.card-mint {border-color:#B8F0E2;box-shadow:0 5px 0 #B8F0E2,0 8px 22px rgba(94,217,184,.1)}
.card-mint::before{background:repeating-linear-gradient(90deg,rgba(94,217,184,.4) 0,rgba(94,217,184,.4) 8px,rgba(140,235,210,.4) 8px,rgba(140,235,210,.4) 16px)}
.card-peach{border-color:#FFD4B0;box-shadow:0 5px 0 #FFD4B0,0 8px 22px rgba(255,176,122,.1)}
.card-peach::before{background:repeating-linear-gradient(90deg,rgba(255,176,122,.4) 0,rgba(255,176,122,.4) 8px,rgba(255,210,170,.4) 8px,rgba(255,210,170,.4) 16px)}
.ctitle{font-size:15px;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ══════════════════════════════════════
   INPUTS
══════════════════════════════════════ */
input[type=text],input[type=date],input[type=number],input[type=tel],select,textarea{
  width:100%;padding:11px 13px;border-radius:13px;
  border:2.5px solid var(--lpink);background:var(--paper);
  font-family:'Gaegu',sans-serif;font-weight:700;font-size:14px;color:var(--text);
  outline:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,143,171,.18)}
textarea{resize:none;min-height:80px;line-height:1.6}
.flbl{font-size:12px;color:var(--textl);display:block;margin-bottom:4px;font-family:'Gaegu',sans-serif;font-weight:700}
.fld{margin-bottom:11px}
.frow{display:flex;gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ══════════════════════════════════════
   BUTTONS
══════════════════════════════════════ */
.btn{
  background:var(--pink);color:#fff;border:none;border-radius:14px;
  padding:11px 18px;font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;
  box-shadow:0 5px 0 var(--dpink),0 8px 18px rgba(255,143,171,.3);
  transition:transform .12s,box-shadow .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dpink)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:12px}
.btn-sky  {background:var(--sky);  box-shadow:0 5px 0 var(--dsky)}
.btn-sky:active  {box-shadow:0 1px 0 var(--dsky)}
.btn-mint {background:var(--mint); box-shadow:0 5px 0 var(--dmint)}
.btn-mint:active {box-shadow:0 1px 0 var(--dmint)}
.btn-yel  {background:var(--yel);color:var(--text);box-shadow:0 5px 0 var(--dyel)}
.btn-yel:active  {box-shadow:0 1px 0 var(--dyel)}
.btn-lav  {background:var(--lav);  box-shadow:0 5px 0 var(--dlav)}
.btn-lav:active  {box-shadow:0 1px 0 var(--dlav)}
.btn-coral{background:var(--coral);box-shadow:0 5px 0 var(--dcoral)}
.btn-coral:active{box-shadow:0 1px 0 var(--dcoral)}
.btn-peach{background:var(--peach);box-shadow:0 5px 0 var(--dpeach)}
.btn-peach:active{box-shadow:0 1px 0 var(--dpeach)}
.btn-ghost{background:#fff;color:var(--textm);border:2.5px solid var(--lpink);box-shadow:0 4px 0 var(--lpink)}
.btn-ghost:active{box-shadow:0 1px 0 var(--lpink)}
.btn-full{width:100%;margin-top:10px}

/* ══════════════════════════════════════
   CHIPS
══════════════════════════════════════ */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:20px;border:2.5px solid var(--lpink);background:#fff;font-family:'Jua',sans-serif;font-size:12px;cursor:pointer;color:var(--textm);transition:all .18s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink);transform:scale(1.05)}
.chip-sky.on  {background:var(--sky);  border-color:var(--sky)}
.chip-mint.on {background:var(--mint); border-color:var(--mint)}
.chip-peach.on{background:var(--peach);border-color:var(--peach)}
.chip-lav.on  {background:var(--lav);  border-color:var(--lav)}
.chip-sky {border-color:#C0E8FF;color:var(--dsky)}
.chip-mint{border-color:#B8F0E2;color:var(--dmint)}
.chip-peach{border-color:#FFD4B0;color:var(--dpeach)}
.chip-lav {border-color:#DFD0FF;color:var(--dlav)}

/* ══════════════════════════════════════
   TAB BAR
══════════════════════════════════════ */
.tab-bar{display:flex;border-radius:14px;padding:4px;margin-bottom:14px}
.tb-sky  {background:#EEF8FF}
.tb-yel  {background:#FFF8DC}
.tb-lav  {background:#EDE4FF}
.tab-btn{flex:1;padding:8px;border-radius:11px;border:none;background:none;font-family:'Jua',sans-serif;font-size:12px;color:var(--textl);cursor:pointer;transition:all .2s}
.tab-btn.on{background:#fff;color:var(--text);box-shadow:0 3px 10px rgba(0,0,0,.1)}

/* ══════════════════════════════════════
   STATS
══════════════════════════════════════ */
.stats{display:flex;gap:9px;margin-bottom:12px}
.stat{flex:1;text-align:center;padding:12px 6px;border-radius:var(--r);border:2px solid transparent}
.stat-pk{background:#FFF0F5;border-color:var(--lpink)}
.stat-sk{background:#EEF8FF;border-color:#C0E8FF}
.stat-mn{background:#EDFFF8;border-color:#B8F0E2}
.stat-lv{background:#F4EFFF;border-color:#DFD0FF}
.stat-yl{background:#FFFBE0;border-color:#FFE899}
.stat-n{font-size:26px}.sn-pk{color:var(--pink)}.sn-sk{color:var(--dsky)}.sn-mn{color:var(--dmint)}.sn-lv{color:var(--dlav)}.sn-yl{color:#C09000}
.stat-l{font-size:10px;color:var(--textl);font-family:'Gaegu',sans-serif;font-weight:700;margin-top:2px}

/* ══════════════════════════════════════
   HOME WIDGETS
══════════════════════════════════════ */
/* D-Day Banner */
.dday-banner{
  background:linear-gradient(135deg,#FF8FAB,#C3A4FF);
  border-radius:var(--rb);padding:14px 18px;margin-bottom:12px;
  box-shadow:0 5px 0 var(--dpink),0 8px 22px rgba(255,143,171,.3);
  display:flex;align-items:center;gap:14px;
}
.ddb-ico{font-size:36px;animation:bnc 1.2s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ddb-count{font-size:28px;color:#fff}
.ddb-name{font-size:13px;color:rgba(255,255,255,.95)}
.ddb-date{font-size:11px;color:rgba(255,255,255,.75);font-family:'Gaegu',sans-serif;font-weight:700}

/* Motivation strip */
.motiv-strip{
  background:linear-gradient(135deg,#FFE040,#FFB07A);
  border-radius:var(--rb);padding:14px 18px;margin-bottom:12px;
  box-shadow:0 4px 0 var(--dyel);display:flex;align-items:center;gap:12px;cursor:pointer;
}
.motiv-ico{font-size:28px}
.motiv-txt{font-size:14px;color:#fff;font-family:'Gaegu',sans-serif;font-weight:700;flex:1;line-height:1.45;text-shadow:0 1px 0 rgba(0,0,0,.1)}
.motiv-hint{font-size:18px;color:rgba(255,255,255,.6)}

/* Quote */
.quote-card{
  background:linear-gradient(135deg,#FFF5F8,#F5F0FF);
  border:2.5px dashed var(--lpink);border-radius:var(--rb);
  padding:14px 18px;margin-bottom:12px;text-align:center;
}
.quote-txt{font-size:14px;color:var(--text);line-height:1.65;font-family:'Gaegu',sans-serif;font-weight:700;margin-bottom:5px}
.quote-src{font-size:11px;color:var(--textl)}

/* Unified tip card */
.tip-card{
  width:100%;
  background:linear-gradient(135deg,#FF8FAB 0%,#C3A4FF 50%,#6EC9F5 100%);
  border-radius:var(--rb);padding:18px 20px;border:none;cursor:pointer;text-align:left;
  box-shadow:0 5px 0 var(--dpink),0 8px 22px rgba(255,143,171,.3);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;display:block;
}
.tip-card:active{transform:scale(.95) translateY(3px);box-shadow:0 1px 0 var(--dpink)}
.tip-card::after{content:'✨';position:absolute;bottom:-12px;right:-8px;font-size:76px;opacity:.14;transform:rotate(20deg)}
.tc-badge{display:inline-block;background:rgba(255,255,255,.28);border-radius:20px;padding:4px 12px;font-size:11px;color:#fff;font-family:'Jua',sans-serif;margin-bottom:9px}
.tc-txt{font-size:15px;color:#fff;font-family:'Gaegu',sans-serif;font-weight:700;line-height:1.6;min-height:48px;text-shadow:0 1px 0 rgba(0,0,0,.1)}
.tc-footer{font-size:11px;color:rgba(255,255,255,.75);margin-top:9px;font-family:'Gaegu',sans-serif;font-weight:700}

/* Checklist */
.task-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:2px dashed var(--lpink)}
.task-row:last-child{border-bottom:none}
.task-cb{width:22px;height:22px;accent-color:var(--pink);cursor:pointer;flex-shrink:0}
.task-txt{flex:1;font-size:14px;color:var(--text);font-family:'Gaegu',sans-serif;font-weight:700}
.task-txt.done{text-decoration:line-through;color:var(--textl)}
.task-del{background:none;border:none;color:#CCC;font-size:15px;cursor:pointer}

/* Mood tracker */
.mood-tracker{display:flex;flex-direction:column;gap:5px}
.mt-bars{display:flex;gap:5px;align-items:flex-end;height:64px;justify-content:space-around}
.mt-bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.mt-bar{width:100%;border-radius:7px 7px 0 0;min-height:5px;transition:height .6s cubic-bezier(.34,1.56,.64,1)}
.mt-emo{font-size:14px;line-height:1}
.mt-days{display:flex;justify-content:space-around}
.mt-day{flex:1;text-align:center;font-size:10px;color:var(--textl);font-family:'Gaegu',sans-serif;font-weight:700}

/* Wish mini */
.wish-mini{
  background:linear-gradient(135deg,#F5F4FF,#EDE4FF);
  border:2.5px solid #C8DAFF;border-radius:var(--rb);
  padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;
  box-shadow:0 4px 0 #C8DAFF;
}
.wm-jar{font-size:34px;animation:flt 3s ease-in-out infinite;flex-shrink:0}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wm-right{flex:1;min-width:0}
.wm-cnt{font-size:12px;color:#6644CC;font-family:'Gaegu',sans-serif;font-weight:700}
.wm-txt{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Gaegu',sans-serif;font-weight:700;margin-top:2px}

/* ══════════════════════════════════════
   CALENDAR
══════════════════════════════════════ */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-btn{background:none;border:none;font-size:26px;cursor:pointer;color:var(--textl);padding:4px 12px;border-radius:10px;transition:background .15s}
.cal-btn:active{background:var(--lpink)}
.cal-lbl{font-size:17px;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-hd{text-align:center;font-size:10px;color:var(--textl);font-family:'Gaegu',sans-serif;font-weight:700;padding:3px 0}
.cal-cell{
  aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:13px;
  background:#FFF5F8;cursor:pointer;border:none;font-family:'Jua',sans-serif;
  position:relative;transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.cal-cell:active{transform:scale(.85)}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell.today{box-shadow:0 0 0 2.5px var(--pink);background:#FFF0F5}
.cal-cell.has-ev::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--pink)}
.cal-cell.has-bd::after{background:var(--yel)!important}
.cal-cell.has-ev.has-bd::after{background:linear-gradient(90deg,var(--pink) 50%,var(--yel) 50%)!important}
.cal-cell.is-dd{border:2.5px solid var(--coral)}
.cal-num{font-size:13px;line-height:1}
.cal-ico{font-size:10px;line-height:1}

/* Event panel */
.ev-panel{background:#fff;border-radius:var(--rb);border:2.5px solid var(--lpink);box-shadow:0 5px 0 #FFD6E2;padding:14px;margin-top:10px}
.ev-date-lbl{font-size:13px;color:var(--textm);font-family:'Gaegu',sans-serif;font-weight:700;margin-bottom:9px}
.ev-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:2px dashed var(--lpink)}
.ev-item:last-child{border-bottom:none}
.ev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ev-body{flex:1}
.ev-ttl{font-size:13px;color:var(--text);font-family:'Gaegu',sans-serif;font-weight:700}
.ev-memo-txt{font-size:11px;color:var(--textl);margin-top:2px}
.ev-del{background:none;border:none;color:#CCC;font-size:14px;cursor:pointer;flex-shrink:0}
.ev-empty{text-align:center;padding:10px;color:var(--textl);font-size:13px;font-family:'Gaegu',sans-serif;font-weight:700}

/* D-Day items */
.dd-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;background:#FFF5F8;border:2px solid var(--lpink);margin-bottom:8px}
.dd-left{display:flex;align-items:center;gap:10px}
.dd-ico{font-size:22px}.dd-name{font-size:14px;color:var(--text);font-family:'Gaegu',sans-serif;font-weight:700}.dd-date{font-size:11px;color:var(--textl)}
.dd-count{font-size:17px;color:var(--pink);font-weight:900}
.dd-count.past{color:var(--textl)}.dd-count.today-d{color:var(--coral)}

/* ══════════════════════════════════════
   DIARY PIN
══════════════════════════════════════ */
.pin-wrap{padding:28px 28px 36px}
.pin-icon{font-size:52px;text-align:center;margin-bottom:6px;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.pin-title{font-size:17px;color:var(--text);text-align:center}
.pin-hint{font-size:13px;color:var(--textl);text-align:center;margin-top:5px;min-height:20px;font-family:'Gaegu',sans-serif;font-weight:700}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:20px 0}
.pd{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--peach);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.pd.filled{background:var(--peach);transform:scale(1.2);box-shadow:0 3px 0 var(--dpeach)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto}
.pk{aspect-ratio:1;border-radius:50%;border:3px solid var(--lpink);background:#fff;font-family:'Jua',sans-serif;font-size:24px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--lpink);transition:transform .12s,box-shadow .12s}
.pk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lpink)}
.pk-sm{font-size:13px;color:var(--textl)}

/* Diary write */
.mood-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mood-rlbl{font-size:12px;color:var(--textl);font-family:'Gaegu',sans-serif;font-weight:700}
.mood-btn{background:none;border:2px solid transparent;border-radius:50%;font-size:21px;width:35px;height:35px;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center}
.mood-btn.sel{border-color:var(--yel);background:#FFFBDC;transform:scale(1.25)}
.stk-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:5px 0}
.stk-btn{background:none;border:none;font-size:21px;cursor:pointer;border-radius:9px;padding:2px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.stk-btn:active{transform:scale(.72)}
.stk-area{min-height:38px;padding:7px;background:var(--paper);border-radius:12px;border:2.5px dashed var(--lpink);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.stk-ph{font-size:12px;color:#CCC;font-family:'Gaegu',sans-serif;font-weight:700}
.lock-row{display:flex;justify-content:flex-end;gap:9px;margin-top:10px}
.btn-lock{background:none;border:2.5px solid var(--peach);color:var(--dpeach);border-radius:13px;padding:8px 14px;font-family:'Jua',sans-serif;font-size:13px;cursor:pointer}
.diary-entry{background:#fff;border-radius:var(--rb);padding:14px;margin-bottom:10px;border:2.5px solid #FFE899;box-shadow:0 5px 0 #FFE899,0 8px 18px rgba(255,204,0,.1);position:relative}
.diary-entry::before{content:'';position:absolute;top:-5px;right:18px;width:40px;height:12px;border-radius:3px;transform:rotate(-2deg);background:repeating-linear-gradient(90deg,rgba(255,224,64,.5) 0,rgba(255,224,64,.5) 8px,rgba(255,240,120,.5) 8px,rgba(255,240,120,.5) 16px)}

/* ══════════════════════════════════════
   ALBUM
══════════════════════════════════════ */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photo-item{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.1);border:3px solid #fff}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.pi-fav{position:absolute;top:5px;right:5px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.pi-del{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.5);border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.pi-cat{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.45);border-radius:8px;font-size:9px;color:#fff;padding:2px 6px;font-family:'Gaegu',sans-serif;font-weight:700}
.vid-item{background:#111;border-radius:var(--r);overflow:hidden;margin-bottom:10px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.vid-item video{width:100%;max-height:210px;display:block}
.vid-meta{background:var(--paper);padding:9px 13px;display:flex;align-items:center;justify-content:space-between}
.vid-title{font-size:13px;color:var(--text);font-family:'Gaegu',sans-serif;font-weight:700}
.vid-del{background:none;border:none;color:#CCC;font-size:14px;cursor:pointer}

/* Photo modal */
.ph-modal{display:none;position:fixed;inset:0;background:rgba(20,0,40,.92);z-index:300;align-items:center;justify-content:center;flex-direction:column}
.ph-modal.open{display:flex}
.pm-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pm-img{max-width:95vw;max-height:72vh;border-radius:var(--rb);object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pm-cap{color:#fff;font-size:14px;margin-top:12px;font-family:'Gaegu',sans-serif;font-weight:700}

/* ══════════════════════════════════════
   PROFILE
══════════════════════════════════════ */
.prof-hero{text-align:center;padding:16px 0 10px}
.prof-pic-ring{position:relative;display:inline-block;margin-bottom:8px}
.prof-pic-def{width:96px;height:96px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 20px rgba(195,164,255,.4);background:linear-gradient(135deg,var(--lpink),var(--lav));display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto}
.prof-pic-img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 20px rgba(195,164,255,.4);display:none}
.prof-pic-edit{position:absolute;bottom:4px;right:4px;background:var(--pink);border:2px solid #fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(255,143,171,.4)}
.prof-name{font-size:19px;color:var(--text);margin-bottom:4px}
.prof-mbti-badge{display:inline-block;background:var(--lav);color:#fff;font-size:12px;padding:3px 12px;border-radius:20px;box-shadow:0 3px 0 var(--dlav)}
.prof-bio{font-size:13px;color:var(--textm);margin-top:6px;font-family:'Gaegu',sans-serif;font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.info-box{background:#FFF8FB;border:2px solid var(--lpink);border-radius:14px;padding:10px 12px}
.info-lbl{font-size:11px;color:var(--textl);font-family:'Gaegu',sans-serif;font-weight:700;margin-bottom:3px}
.info-val{font-size:14px;color:var(--text);font-family:'Gaegu',sans-serif;font-weight:700}
.hobby-tags{display:flex;flex-wrap:wrap;gap:7px}
.hobby-tag{padding:6px 14px;border-radius:20px;font-size:13px;color:#fff}

/* ══════════════════════════════════════
   MODALS (bottom sheet)
══════════════════════════════════════ */
.bottom-modal{display:none;position:fixed;inset:0;background:rgba(30,0,50,.65);z-index:200;align-items:flex-end;justify-content:center}
.bottom-modal.open{display:flex;animation:mFade .25s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.bm-sheet{background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 44px;width:100%;max-height:88vh;overflow-y:auto}
.bm-handle{width:40px;height:5px;background:#E0D8F0;border-radius:10px;margin:0 auto 16px}
.bm-title{font-size:17px;color:var(--text);margin-bottom:16px;text-align:center}

/* Tip modal */
.tip-modal{display:none;position:fixed;inset:0;background:rgba(30,0,50,.65);z-index:200;align-items:flex-end;justify-content:center}
.tip-modal.open{display:flex;animation:mFade .25s ease}
.tm-sheet{background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 44px;width:100%;max-height:80vh;overflow-y:auto;position:relative}
.tm-handle{width:40px;height:5px;background:#E0D8F0;border-radius:10px;margin:0 auto 16px}
.tm-title{font-size:18px;color:var(--text);margin-bottom:14px;text-align:center}
.tm-close{position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--textl)}
.tip-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:2px dashed var(--lpink)}
.tip-item:last-child{border-bottom:none}
.tip-ico{font-size:22px;flex-shrink:0;margin-top:1px}
.tip-txt{font-size:14px;color:var(--text);line-height:1.55;font-family:'Gaegu',sans-serif;font-weight:700}

/* ══════════════════════════════════════
   MISC
══════════════════════════════════════ */
.slabel{font-size:11px;color:var(--textl);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 7px;display:flex;align-items:center;gap:7px}
.slabel::after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,var(--lpink),transparent)}
.li-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:2px dashed var(--lpink)}
.li-row:last-child{border-bottom:none}
.li-dot{width:9px;height:9px;border-radius:50%;background:var(--pink);flex-shrink:0}
.li-txt{flex:1;font-size:14px;color:var(--text);font-family:'Gaegu',sans-serif;font-weight:700}
.li-del{background:none;border:none;color:#CCC;font-size:14px;cursor:pointer}
.empty-box{text-align:center;padding:24px 16px;color:var(--textl)}
.e-ico{font-size:40px;display:block;margin-bottom:9px;animation:wobE 3s ease-in-out infinite}
.e-txt{font-size:14px;font-family:'Gaegu',sans-serif;font-weight:700}
@keyframes wobE{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* Star pop */
.star-pop{position:fixed;pointer-events:none;z-index:999;font-size:26px;animation:sP 1.4s forwards}
@keyframes sP{0%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.2) translateY(-140px)}}

/* Toast */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-20px);background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-size:14px;padding:11px 20px;border-radius:30px;opacity:0;z-index:999;pointer-events:none;transition:all .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 5px 20px rgba(255,143,171,.4);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--lpink);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -5px 20px rgba(255,143,171,.1)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px;background:none;border:none;font-family:'Jua',sans-serif}
.ni-ico{font-size:23px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.ni-lbl{font-size:10px;color:var(--textl)}
.ni.on .ni-lbl{color:var(--pink)}.ni.on .ni-ico{transform:scale(1.28) translateY(-3px)}

/* ══════════════════════════════════════
   RESPONSIVE — MOBILE FIRST (< 480px)
══════════════════════════════════════ */
@media (max-width: 480px) {
  :root { --rb: 22px; --r: 16px; }

  .home-hd  { padding: 48px 16px 26px; border-radius: 0 0 28px 28px; }
  .hd-title { font-size: 20px; }
  .hd-greeting { font-size: 12px; }
  .dt-badge { font-size: 11px; padding: 4px 10px; }
  .hd-datetime { gap: 5px; }

  .hd-mood-row { padding: 9px 12px; gap: 6px; }
  .hm-btn { width: 30px; height: 30px; font-size: 16px; }

  .phd { padding: 46px 16px 22px; border-radius: 0 0 24px 24px; }
  .phd-title { font-size: 19px; }
  .phd-deco { font-size: 64px; }

  .ct { padding: 12px 12px 8px; }
  .card { padding: 14px; border-radius: 20px; }
  .ctitle { font-size: 14px; }

  .sec { font-size: 13px; margin: 14px 0 9px; }

  .dday-banner { padding: 12px 14px; gap: 10px; border-radius: 20px; }
  .ddb-ico { font-size: 28px; }
  .ddb-count { font-size: 22px; }
  .ddb-name { font-size: 12px; }

  .motiv-strip { padding: 12px 14px; gap: 10px; border-radius: 20px; }
  .motiv-ico { font-size: 24px; }
  .motiv-txt { font-size: 13px; }

  .quote-card { padding: 12px 14px; border-radius: 20px; }
  .quote-txt { font-size: 13px; }

  .tip-card { padding: 16px; border-radius: 20px; }
  .tc-txt { font-size: 14px; min-height: 44px; }
  .tc-badge { font-size: 11px; padding: 3px 10px; }
  .tc-footer { font-size: 10px; }

  .task-txt { font-size: 13px; }
  input[type=text], input[type=date], input[type=number], input[type=tel], select, textarea { font-size: 13px; padding: 10px 12px; }

  .mt-bars { height: 56px; }
  .mt-emo { font-size: 12px; }
  .mt-day { font-size: 9px; }

  .wish-mini { padding: 12px 14px; gap: 10px; border-radius: 20px; }
  .wm-jar { font-size: 28px; }
  .wm-cnt { font-size: 11px; }
  .wm-txt { font-size: 12px; }

  .btn { padding: 10px 15px; font-size: 13px; border-radius: 12px; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 10px; }
  .btn-full { margin-top: 9px; }

  .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .photo-item { border-radius: 11px; border-width: 2px; }

  .cal-cell { font-size: 12px; border-radius: 8px; }
  .cal-num { font-size: 12px; }
  .cal-hd { font-size: 9px; }
  .cal-lbl { font-size: 15px; }
  .cal-btn { font-size: 22px; padding: 4px 8px; }

  .ev-panel { padding: 12px; border-radius: 18px; }
  .ev-ttl { font-size: 12px; }
  .ev-memo-txt { font-size: 10px; }

  .dd-item { padding: 9px 12px; border-radius: 12px; }
  .dd-name { font-size: 13px; }
  .dd-count { font-size: 15px; }

  .pin-wrap { padding: 22px 20px 30px; }
  .pin-icon { font-size: 44px; }
  .pin-title { font-size: 15px; }
  .pin-hint { font-size: 12px; }

  .pk { font-size: 21px; }

  .mood-btn { width: 32px; height: 32px; font-size: 19px; }

  .stk-btn { font-size: 19px; }

  .diary-entry { padding: 12px; border-radius: 18px; }

  .prof-pic-def, .prof-pic-img { width: 84px; height: 84px; }

  .prof-name { font-size: 17px; }

  .bm-sheet { padding: 18px 16px 40px; }
  .bm-title { font-size: 15px; }
  .tm-sheet { padding: 18px 16px 40px; }
  .tm-title { font-size: 16px; }
  .tip-txt { font-size: 13px; }

  .bnav { padding: 7px 0 calc(7px + env(safe-area-inset-bottom)); }

  .ni-lbl { font-size: 9px; }

  .grid2 { grid-template-columns: 1fr 1fr; gap: 8px; }

  .tab-btn { font-size: 11px; padding: 7px; }
  .tab-bar { border-radius: 12px; }

  .chip { padding: 5px 11px; font-size: 11px; }

  .stat-n { font-size: 22px; }

  .vid-item video { max-height: 180px; }
}

/* ══════════════════════════════════════
   iPad / 태블릿 (768px ~ 1024px)
   - 2컬럼 레이아웃, 여백 넓게
══════════════════════════════════════ */
@media (min-width: 768px) {
  :root { --rb: 26px; --r: 20px; }

  /* 최대 너비 고정 + 중앙 정렬 */
  body { background-size: 28px 28px; }

  .page { max-width: 720px; margin: 0 auto; }

  /* 홈 헤더 */
  .home-hd { padding: 64px 32px 36px; border-radius: 0 0 44px 44px; }
  .hd-title { font-size: 30px; }
  .hd-greeting { font-size: 15px; }
  .dt-badge { font-size: 14px; padding: 6px 16px; }
  .hd-datetime { gap: 10px; }
  .hm-btn { width: 42px; height: 42px; font-size: 22px; }
  .hd-mood-row { padding: 13px 18px; border-radius: 22px; }

  /* 페이지 헤더 */
  .phd { padding: 60px 32px 30px; border-radius: 0 0 40px 40px; }
  .phd-title { font-size: 27px; }
  .phd-sub { font-size: 15px; }
  .phd-deco { font-size: 100px; right: -12px; bottom: -16px; }
  .phd-back { font-size: 15px; }

  .ct { padding: 20px 24px 12px; }

  /* 카드 */
  .card { padding: 22px; border-radius: 28px; margin-bottom: 16px; }
  .ctitle { font-size: 17px; }

  .sec { font-size: 16px; margin: 20px 0 13px; }

  /* 홈 위젯 2컬럼 */
  .home-widgets-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* Tip card */
  .tip-card { padding: 22px 26px; }
  .tc-badge { font-size: 13px; padding: 5px 14px; margin-bottom: 11px; }
  .tc-txt { font-size: 17px; min-height: 60px; }
  .tc-footer { font-size: 13px; margin-top: 12px; }

  /* Mood strip */
  .dday-banner { padding: 18px 24px; gap: 16px; border-radius: 28px; }
  .ddb-ico { font-size: 42px; }
  .ddb-count { font-size: 34px; }
  .ddb-name { font-size: 15px; }

  .motiv-strip { padding: 18px 22px; gap: 14px; border-radius: 28px; }
  .motiv-ico { font-size: 34px; }
  .motiv-txt { font-size: 16px; }

  .quote-card { padding: 18px 22px; }
  .quote-txt { font-size: 16px; }

  /* checklist */
  .task-txt { font-size: 16px; }
  .task-cb  { width: 24px; height: 24px; }
  .task-row { padding: 11px 0; }

  /* Mood tracker */
  .mt-bars { height: 90px; }
  .mt-emo { font-size: 17px; }
  .mt-day { font-size: 12px; }

  /* Wish mini */
  .wish-mini { padding: 18px 20px; gap: 14px; border-radius: 28px; }
  .wm-jar { font-size: 42px; }
  .wm-cnt { font-size: 14px; }
  .wm-txt { font-size: 15px; }

  /* Buttons */
  .btn { padding: 13px 22px; font-size: 16px; border-radius: 16px; }
  .btn-sm { padding: 10px 17px; font-size: 14px; border-radius: 13px; }

  /* Photo grid — 4 columns on tablet */
  .photo-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .photo-item { border-radius: 16px; }
  .pi-fav { width: 30px; height: 30px; font-size: 16px; }
  .pi-del { width: 26px; height: 26px; font-size: 13px; }

  /* Calendar */
  .cal-cell { font-size: 16px; border-radius: 12px; }
  .cal-num  { font-size: 16px; }
  .cal-hd   { font-size: 12px; padding: 5px 0; }
  .cal-lbl  { font-size: 20px; }
  .cal-btn  { font-size: 30px; }
  .cal-grid { gap: 7px; }

  .ev-panel { padding: 18px; border-radius: 22px; }
  .ev-ttl { font-size: 15px; }
  .ev-memo-txt { font-size: 12px; }

  .dd-item { padding: 13px 18px; border-radius: 18px; }
  .dd-name { font-size: 16px; }
  .dd-count { font-size: 22px; }
  .dd-ico { font-size: 28px; }

  /* Diary PIN */
  .pin-wrap { padding: 36px 48px 48px; }
  .pin-icon { font-size: 64px; }
  .pin-title { font-size: 20px; }
  .pin-hint { font-size: 15px; }
  .pin-pad { max-width: 320px; gap: 16px; }
  .pk { font-size: 28px; }
  .pd { width: 24px; height: 24px; }
  .pin-dots { gap: 20px; margin: 28px 0; }

  /* Diary */
  .mood-btn { width: 42px; height: 42px; font-size: 26px; }
  .stk-grid { grid-template-columns: repeat(10, 1fr); gap: 7px; }
  .stk-btn { font-size: 26px; }
  .stk-area { min-height: 48px; padding: 9px 13px; border-radius: 16px; }
  .diary-entry { padding: 18px; border-radius: 22px; }

  /* Profile */
  .prof-pic-def, .prof-pic-img { width: 110px; height: 110px; }
  .prof-pic-def { font-size: 44px; }
  .prof-name { font-size: 22px; }
  .info-box { padding: 12px 14px; border-radius: 16px; }
  .info-lbl { font-size: 12px; }
  .info-val { font-size: 16px; }
  .prof-bio { font-size: 15px; }
  .hobby-tag { font-size: 15px; padding: 8px 18px; }

  /* Bottom sheet */
  .bm-sheet { padding: 28px 28px 52px; border-radius: 36px 36px 0 0; }
  .bm-title { font-size: 19px; margin-bottom: 20px; }
  .bm-handle { width: 50px; height: 6px; margin-bottom: 20px; }

  /* Bottom nav */
  .bnav { padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
  .ni-ico { font-size: 27px; }
  .ni-lbl { font-size: 11px; }

  /* Inputs */
  input[type=text], input[type=date], input[type=number], input[type=tel], select, textarea { font-size: 15px; padding: 13px 15px; border-radius: 16px; }
  .flbl { font-size: 13px; }
  .fld { margin-bottom: 14px; }

  /* Grid2 */
  .grid2 { gap: 14px; }
  .info-grid { gap: 12px; }

  /* Tabs */
  .tab-btn { font-size: 14px; padding: 10px; }
  .tab-bar { border-radius: 16px; padding: 5px; margin-bottom: 18px; }

  /* Chips */
  .chip { padding: 8px 16px; font-size: 13px; }

  /* Stats */
  .stat-n { font-size: 30px; }
  .stat-l { font-size: 11px; }
  .stats { gap: 12px; margin-bottom: 16px; }
  .stat { padding: 16px 10px; }

  /* Slabel */
  .slabel { font-size: 12px; margin: 18px 0 9px; }

  /* Alert badge */
  .toast { font-size: 15px; padding: 13px 24px; }
}

/* ══════════════════════════════════════
   Large Tablet — Galaxy Tab S8+ / iPad Pro 12.9" (≥ 1024px)
══════════════════════════════════════ */
@media (min-width: 1024px) {
  .page { max-width: 860px; }

  .home-hd { padding: 70px 40px 40px; border-radius: 0 0 50px 50px; }
  .hd-title { font-size: 34px; }
  .hd-greeting { font-size: 16px; }
  .dt-badge { font-size: 15px; padding: 7px 18px; }
  .hm-btn { width: 46px; height: 46px; font-size: 24px; }

  .phd { padding: 68px 40px 34px; border-radius: 0 0 48px 48px; }
  .phd-title { font-size: 30px; }

  .ct { padding: 24px 32px 14px; }
  .card { padding: 26px; margin-bottom: 18px; }

  /* 3-column photo grid on large tablet */
  .photo-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .tip-card { padding: 26px 30px; }
  .tc-txt { font-size: 18px; min-height: 64px; }

  .mt-bars { height: 100px; gap: 8px; }
  .mt-emo { font-size: 18px; }

  .cal-cell { font-size: 17px; border-radius: 14px; }
  .cal-grid { gap: 8px; }

  .stk-grid { grid-template-columns: repeat(12, 1fr); gap: 8px; }
  .stk-btn { font-size: 28px; }

  .prof-pic-def, .prof-pic-img { width: 120px; height: 120px; }
  .prof-pic-def { font-size: 48px; }
  .prof-name { font-size: 24px; }

  .bnav { max-width: 860px; margin: 0 auto; left: 50%; transform: translateX(-50%); }
  .ni-ico { font-size: 28px; }
  .ni-lbl { font-size: 12px; }

  .pin-pad { max-width: 340px; }
}

/* ══════════════════════════════════════
   Landscape 가로 모드 (phone landscape)
══════════════════════════════════════ */
@media (max-height: 500px) and (orientation: landscape) {
  .home-hd { padding: 16px 20px 14px; border-radius: 0 0 20px 20px; }
  .hd-title { font-size: 18px; margin-bottom: 6px; }
  .hd-datetime { margin-bottom: 8px; }
  .hd-mood-row { padding: 7px 12px; }
  .hm-btn { width: 28px; height: 28px; font-size: 15px; }

  .phd { padding: 14px 20px 12px; border-radius: 0 0 18px 18px; }
  .phd-title { font-size: 17px; }
  .phd-deco { display: none; }

  .page { padding-bottom: 70px; }

  .pin-wrap { padding: 10px 28px 16px; }
  .pin-icon { font-size: 36px; margin-bottom: 4px; }
  .pin-dots { margin: 12px 0; }
  .pin-pad { gap: 8px; max-width: 240px; }

  .dday-banner { padding: 10px 14px; }
  .ddb-ico { font-size: 24px; }
  .ddb-count { font-size: 20px; }

  .bnav { padding: 5px 0 calc(5px + env(safe-area-inset-bottom)); }
  .ni-ico { font-size: 19px; }
  .ni-lbl { display: none; }

  .bm-sheet { max-height: 92vh; padding: 14px 18px 24px; }
}

/* ══════════════════════════════════════
   Safe area (notch / Dynamic Island)
══════════════════════════════════════ */
@supports (padding-top: env(safe-area-inset-top)) {
  .home-hd {
    padding-top: calc(52px + env(safe-area-inset-top));
  }
  .phd {
    padding-top: calc(48px + env(safe-area-inset-top));
  }
}

function renderHomeDday(){
  var banner=document.getElementById('home-dday-banner'); banner.innerHTML='';
  if(!D.ddays.length) return;
  var now=new Date(); now.setHours(0,0,0,0);
  var upcoming=D.ddays.map(function(dd){
    var d=new Date(dd.date); d.setHours(0,0,0,0);
    return{dd:dd,diff:Math.round((d-now)/86400000)};
  }).filter(function(x){ return x.diff>=0; }).sort(function(a,b){ return a.diff-b.diff; });
  if(!upcoming.length) return;
  var top=upcoming[0];
  banner.innerHTML='<div class="dday-banner">'
    +'<span class="ddb-ico">'+top.dd.ico+'</span>'
    +'<div><div class="ddb-count">D-'+(top.diff===0?'DAY':top.diff)+'</div>'
    +'<div class="ddb-name">'+esc(top.dd.name)+'</div>'
    +'<div class="ddb-date">'+top.dd.date+'</div></div></div>';
}

/* ── TASK CHECKLIST ── */
document.getElementById('task-add').addEventListener('click', addTask);

function addTask(){
  var v=document.getElementById('task-in').value.trim(); if(!v) return;
  D.tasks.push({id:'t'+Date.now(),text:v,done:false,date:todayStr()});
  document.getElementById('task-in').value='';
  save(); renderTaskList(); toast('✅ 할 일 추가됨!');
}

function renderTaskList(){
  var el=document.getElementById('task-list'); if(!el) return;
  var today=todayStr();
  var items=D.tasks.filter(function(t){ return t.date===today; });
  if(!items.length){ el.innerHTML='<div style="text-align:center;padding:10px;color:var(--textl);font-size:13px;font-family:Gaegu,sans-serif;font-weight:700">오늘 할 일을 추가해봐요! 🌸</div>'; return; }
  el.innerHTML='';
  items.forEach(function(task){
    var idx=D.tasks.indexOf(task);
    var row=document.createElement('div'); row.className='task-row';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.className='task-cb'; cb.checked=task.done;
    cb.addEventListener('change',function(){ D.tasks[idx].done=cb.checked; save(); renderTaskList(); if(cb.checked) toast('🎉 완료!'); });
    var txt=document.createElement('div'); txt.className='task-txt'+(task.done?' done':''); txt.textContent=task.text;
    var del=document.createElement('button'); del.className='task-del'; del.textContent='✕';
    del.addEventListener('click',function(){ D.tasks.splice(idx,1); save(); renderTaskList(); });
    row.appendChild(cb); row.appendChild(txt); row.appendChild(del); el.appendChild(row);
  });
}

/* ── MOOD TRACKER ── */
var MOOD_SC={'😊':4,'😄':5,'🥰':5,'🤩':5,'😐':3,'😤':2,'😢':1,'😴':2};
var MOOD_CL={'😊':'#FF8FAB','😄':'#FFB347','🥰':'#C3A4FF','🤩':'#5ED9B8','😐':'#6EC9F5','😤':'#FF7C6E','😢':'#A0C4FF','😴':'#B0A0C4'};

function renderMoodTracker(){
  var bars=document.getElementById('mt-bars'); var days=document.getElementById('mt-days');
  if(!bars||!days) return;
  var today=new Date(); today.setHours(0,0,0,0);
  bars.innerHTML=''; days.innerHTML='';
  for(var i=6;i>=0;i--){
    var d=new Date(today); d.setDate(d.getDate()-i);
    var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var mood=D.moodLog[ds]||'';
    var sc=mood?(MOOD_SC[mood]||3):0;
    var cl=mood?(MOOD_CL[mood]||'#FFD6E2'):'#F0EEF8';
    var pct=sc>0?(sc/5)*100:7;
    var col=document.createElement('div'); col.className='mt-bar-col';
    var bar=document.createElement('div'); bar.className='mt-bar'; bar.style.cssText='height:'+pct+'%;background:'+cl;
    var emo=document.createElement('div'); emo.className='mt-emo'; emo.textContent=mood||'·';
    col.appendChild(bar); col.appendChild(emo); bars.appendChild(col);
    var dayEl=document.createElement('div'); dayEl.className='mt-day';
    dayEl.textContent=i===0?'오늘':DAY_KO[d.getDay()]; days.appendChild(dayEl);
  }
}

      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); },1500);
    },idx*200);
  })(i);}
}

function getEventsForDate(ds){
  var evs=D.events.filter(function(e){ return e.date===ds; });
  if(D.profile.birth){
    var b=new Date(D.profile.birth);
    var parts=ds.split('-');
    if(b.getMonth()+1===parseInt(parts[1]) && b.getDate()===parseInt(parts[2])){
      evs=[{id:'bday',date:ds,title:'🎂 '+(D.profile.name||'나')+'의 생일!',type:'생일',memo:''}].concat(evs);
    }
  }
  return evs;
}

function renderCalendar(){
  document.getElementById('cal-lbl').textContent=calY+'년 '+(calM+1)+'월';
  var hd=document.getElementById('cal-hd');
  hd.innerHTML=['일','월','화','수','목','금','토'].map(function(d){ return '<div class="cal-hd">'+d+'</div>'; }).join('');
  var grid=document.getElementById('cal-grid'); grid.innerHTML='';
  var first=new Date(calY,calM,1).getDay();
  var days=new Date(calY,calM+1,0).getDate();
  var today=new Date(); today.setHours(0,0,0,0);
  var ddDates={};
  D.ddays.forEach(function(dd){ ddDates[dd.date]=true; });
  var bdM=0,bdD=0;
  if(D.profile.birth){ var b=new Date(D.profile.birth); bdM=b.getMonth()+1; bdD=b.getDate(); }
  for(var i=0;i<first;i++){ var e=document.createElement('div'); e.className='cal-cell empty'; grid.appendChild(e); }
  for(var day=1;day<=days;day++){
    var ds=calY+'-'+pad(calM+1)+'-'+pad(day);
    var dt=new Date(calY,calM,day); dt.setHours(0,0,0,0);
    var isToday=dt.getTime()===today.getTime();
    var hasEv=D.events.some(function(ev){ return ev.date===ds; });
    var hasBd=bdM===calM+1&&bdD===day;
    var isDd=!!ddDates[ds];
    var cell=document.createElement('button');
    cell.className='cal-cell'+(isToday?' today':'')+(hasEv?' has-ev':'')+(hasBd?' has-bd':'')+(isDd?' is-dd':'');
    cell.innerHTML='<span class="cal-num">'+day+'</span>'+(hasBd?'<span class="cal-ico">🎂</span>':'');
    (function(dateStr){ cell.addEventListener('click', function(){ selDate=dateStr; document.getElementById('ev-date').value=dateStr; showEvPanel(dateStr); }); })(ds);
    grid.appendChild(cell);
  }
  if(selDate) showEvPanel(selDate);
}

function showEvPanel(ds){
  var evs=getEventsForDate(ds);
  var panel=document.getElementById('ev-panel');
  var parts=ds.split('-');
  var lbl=parts[0]+'년 '+parseInt(parts[1])+'월 '+parseInt(parts[2])+'일';
  var DOT_COLORS={일반:'#FF8FAB',학교:'#6EC9F5',취미:'#C3A4FF',가족:'#FFE040',친구:'#5ED9B8',생일:'#FFE040'};
  var html='<div class="ev-panel"><div class="ev-date-lbl">📅 '+lbl+'</div>';
  if(!evs.length){
    html+='<div class="ev-empty">일정이 없어요. 추가해볼까요? 🌸</div>';
  } else {
    evs.forEach(function(ev){
      var dc=DOT_COLORS[ev.type]||'#FF8FAB';
      html+='<div class="ev-item"><div class="ev-dot" style="background:'+dc+'"></div>'
        +'<div class="ev-body"><div class="ev-ttl">'+esc(ev.title)+'</div>'
        +(ev.memo?'<div class="ev-memo-txt">'+esc(ev.memo)+'</div>':'')
        +'</div>';
      if(ev.id!=='bday') html+='<button class="ev-del" data-id="'+ev.id+'">✕</button>';
      html+='</div>';
    });
  }
  html+='</div>';
  panel.innerHTML=html;
  panel.querySelectorAll('.ev-del').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id=btn.getAttribute('data-id');
      D.events=D.events.filter(function(ev){ return ev.id!==id; });
      save(); renderCalendar(); showEvPanel(ds); toast('일정 삭제됨');
    });
  });
}

function renderDdayList(){
  var el=document.getElementById('dd-list'); if(!el) return;
  if(!D.ddays.length){ el.innerHTML='<div class="empty-box"><span class="e-ico">⏳</span><span class="e-txt">D-Day를 추가해봐요!</span></div>'; return; }
  var now=new Date(); now.setHours(0,0,0,0);
  var sorted=D.ddays.slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  el.innerHTML='';
  sorted.forEach(function(dd){
    var d=new Date(dd.date); d.setHours(0,0,0,0);
    var diff=Math.round((d-now)/86400000);
    var cStr=diff>0?'D-'+diff:diff===0?'D-DAY':'D+'+Math.abs(diff);
    var cCls=diff>0?'':diff===0?'today-d':'past';
    var item=document.createElement('div'); item.className='dd-item';
    item.innerHTML='<div class="dd-left"><span class="dd-ico">'+dd.ico+'</span>'
      +'<div><div class="dd-name">'+esc(dd.name)+'</div><div class="dd-date">'+dd.date+'</div></div></div>'
      +'<div style="display:flex;align-items:center;gap:6px">'
      +'<div class="dd-count '+cCls+'">'+cStr+'</div></div>';
    var del=document.createElement('button'); del.className='ev-del'; del.textContent='✕'; del.style.marginLeft='4px';
    (function(id){ del.addEventListener('click', function(){ D.ddays=D.ddays.filter(function(x){ return x.id!==id; }); save(); renderDdayList(); renderHomeDday(); toast('D-Day 삭제됨'); }); })(dd.id);
    item.querySelector('div:last-child').appendChild(del);
    el.appendChild(item);
  });
}

var pinBuf=[], setPinMode=false, tempPin='';
var curDMood='', dStickers=[];
var STKS=['🌸','⭐','🌈','🦋','🎀','💖','🌺','🐱','🌙','✨','🍰','🎵','🌻','🐬','🦄','🎨','🍩','🌟','🌊','🍀','💫','🎹','🏆','🌷','🍓','🐣','🎪','💝'];

function openDiary(){
  pinBuf=[]; setPinMode=false; tempPin='';
  document.getElementById('di-pin').style.display='block';
  document.getElementById('di-content').style.display='none';
  document.getElementById('di-hd-t').textContent='🔐 비밀 일기장';
  document.getElementById('di-hd-s').textContent='비밀번호를 입력하세요';
  updatePins();
  document.getElementById('pin-msg').textContent=D.diary.pin?'비밀번호 4자리를 입력하세요 🔐':'새 비밀번호 4자리를 만들어요 🔒';
  document.getElementById('pin-hint').textContent=D.diary.pin?'':'처음이에요! 나만의 비밀번호를 설정하세요';
}
function updatePins(){ for(var i=1;i<=4;i++) document.getElementById('pd'+i).classList.toggle('filled',pinBuf.length>=i); }

document.querySelectorAll('.pk[data-n]').forEach(function(btn){
  btn.addEventListener('click', function(){ if(pinBuf.length>=4) return; pinBuf.push(btn.getAttribute('data-n')); updatePins(); if(pinBuf.length===4) setTimeout(checkPin,180); });
});
document.getElementById('pin-back').addEventListener('click', function(){ if(pinBuf.length>0){ pinBuf.pop(); updatePins(); } });
document.getElementById('pin-clr').addEventListener('click', function(){ if(pinBuf.length>0){ pinBuf.pop(); updatePins(); } });
document.getElementById('pin-reset').addEventListener('click', function(){
  if(confirm('비밀번호를 초기화할까요?\n(일기 내용은 지워지지 않아요)')){
    D.diary.pin=null; save();
    document.getElementById('pin-msg').textContent='새 비밀번호 4자리를 만들어요 🔒';
    document.getElementById('pin-hint').textContent='처음부터 새로 설정해요';
    pinBuf=[]; updatePins();
  }
});

function checkPin(){
  var entered=pinBuf.join('');
  if(!D.diary.pin){
    if(!setPinMode){ setPinMode=true; tempPin=entered; pinBuf=[]; updatePins(); document.getElementById('pin-msg').textContent='한 번 더 입력해주세요 ✅'; document.getElementById('pin-hint').textContent='같은 번호를 다시 입력해요'; }
    else{
      if(entered===tempPin){ D.diary.pin=entered; save(); setPinMode=false; tempPin=''; unlockDiary(); }
      else{ document.getElementById('pin-hint').textContent='❌ 번호가 달라요! 처음부터 다시!'; setPinMode=false; tempPin=''; pinBuf=[]; updatePins(); document.getElementById('pin-msg').textContent='새 비밀번호 4자리를 만들어요 🔒'; }
    }
  } else {
    if(entered===D.diary.pin){ unlockDiary(); }
    else{ document.getElementById('pin-hint').textContent='❌ 틀렸어요! 다시 시도해봐요'; pinBuf=[]; updatePins(); setTimeout(function(){ document.getElementById('pin-hint').textContent=''; },2000); }
  }
}

function unlockDiary(){
  document.getElementById('di-pin').style.display='none';
  document.getElementById('di-content').style.display='block';
  document.getElementById('di-hd-t').textContent='📔 비밀 일기장';
  document.getElementById('di-hd-s').textContent='나만의 소중한 이야기 ✨';
  curDMood=''; dStickers=[];
  document.querySelectorAll('.mood-btn').forEach(function(b){ b.classList.remove('sel'); });

}

function renderStickerGrid(){
  var el=document.getElementById('stk-grid'); el.innerHTML='';
  STKS.forEach(function(s){
    var btn=document.createElement('button'); btn.className='stk-btn'; btn.textContent=s;
    btn.addEventListener('click', function(){ addSticker(s); });
    el.appendChild(btn);

function addSticker(s){
  dStickers.push(s);
  var area=document.getElementById('stk-area');
  var ph=document.getElementById('stk-ph'); if(ph) ph.remove();
  var sp=document.createElement('span'); sp.style.cssText='font-size:21px;cursor:pointer'; sp.textContent=s;
  sp.addEventListener('click', function(){ area.removeChild(sp); dStickers.splice(dStickers.lastIndexOf(s),1); });
  area.appendChild(sp);
}

    top.appendChild(left); top.appendChild(del); d.appendChild(top);

    body.innerHTML=esc(e.text).replace(/\n/g,'<br>'); d.appendChild(body); el.appendChild(d);
  });
}

function renderAlbum(){
  var items=D.album.items;
  var filtered=items.filter(function(it){ if(albFilter==='전체') return true; if(albFilter==='❤️') return it.fav; return it.cat===albFilter; });
  var photos=filtered.filter(function(it){ return it.type==='photo'; });
  var videos=filtered.filter(function(it){ return it.type==='video'; });
  document.getElementById('alb-empty').style.display=filtered.length?'none':'block';
  var phEl=document.getElementById('alb-pics'); phEl.innerHTML='';
  photos.forEach(function(item){
    var idx=items.indexOf(item);
    var d=document.createElement('div'); d.className='photo-item';
    var img=document.createElement('img'); img.src=item.data; img.loading='lazy';
    img.addEventListener('click', function(){ document.getElementById('pm-img').src=item.data; document.getElementById('pm-cap').textContent=item.cap||''; document.getElementById('ph-modal').classList.add('open'); });
    var fav=document.createElement('button'); fav.className='pi-fav'; fav.textContent=item.fav?'❤️':'🤍';
    fav.addEventListener('click', function(){ D.album.items[idx].fav=!D.album.items[idx].fav; save(); renderAlbum(); });
    var del=document.createElement('button'); del.className='pi-del'; del.textContent='✕';
    del.addEventListener('click', function(){ if(confirm('삭제할까요?')){ D.album.items.splice(idx,1); save(); renderAlbum(); } });
    var cat=document.createElement('div'); cat.className='pi-cat'; cat.textContent=item.cat;
    d.appendChild(img); d.appendChild(fav); d.appendChild(del); d.appendChild(cat); phEl.appendChild(d);
  });
  var vEl=document.getElementById('alb-vids'); vEl.innerHTML='';
  videos.forEach(function(item){
    var idx=items.indexOf(item); var src=vidURLs[item.vidId]||''; if(!src) return;
    var d=document.createElement('div'); d.className='vid-item';
    var vid=document.createElement('video'); vid.src=src; vid.controls=true; vid.setAttribute('playsinline','');
    var meta=document.createElement('div'); meta.className='vid-meta';
    var note=document.createElement('div'); note.className='vid-title'; note.textContent=item.cap||'영상';
    var del=document.createElement('button'); del.className='vid-del'; del.textContent='✕';
    del.addEventListener('click', function(){ if(confirm('삭제할까요?')){ D.album.items.splice(idx,1); save(); renderAlbum(); } });
    meta.appendChild(note); meta.appendChild(del); d.appendChild(vid); d.appendChild(meta); vEl.appendChild(d);
  });
}

/* ════════════════════════════════════
   PROFILE
════════════════════════════════════ */
document.getElementById('prof-edit-btn').addEventListener('click', function(){
  var p=D.profile;
  ['name','birth','height','weight','school','grade','addr','phone','bio'].forEach(function(k){ document.getElementById('ef-'+k).value=p[k]||''; });
  document.getElementById('ef-blood').value=p.blood||'';
  document.getElementById('ef-mbti').value=p.mbti||'';
  document.getElementById('prof-modal').classList.add('open');
});
document.getElementById('ef-cancel').addEventListener('click', function(){ document.getElementById('prof-modal').classList.remove('open'); });
document.getElementById('prof-modal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('open'); });
document.getElementById('ef-save').addEventListener('click', function(){
  var p=D.profile;
  ['name','birth','height','weight','school','grade','addr','phone','bio'].forEach(function(k){ p[k]=document.getElementById('ef-'+k).value.trim(); });
  p.blood=document.getElementById('ef-blood').value;
  p.mbti=document.getElementById('ef-mbti').value;
  save(); document.getElementById('prof-modal').classList.remove('open');
  renderProfile(); initHome(); toast('✅ 프로필 저장됨!');
});

document.getElementById('prof-pic-in').addEventListener('change', function(){
  var file=this.files[0]; if(!file) return;
  var r=new FileReader(); r.onload=function(e){ D.profile.photo=e.target.result; save(); renderProfile(); toast('📷 사진 업데이트!'); };
  r.readAsDataURL(file); this.value='';
});

function renderProfile(){
  var p=D.profile;
  // photo
  var def=document.getElementById('prof-pic-def');
  var img=document.getElementById('prof-pic-img');
  if(p.photo){ def.style.display='none'; img.style.display='block'; img.src=p.photo; }
  else{ def.style.display='flex'; img.style.display='none'; }
  document.getElementById('prof-name').textContent=p.name||'이름을 입력해주세요';
  var mbtiEl=document.getElementById('prof-mbti');
  mbtiEl.innerHTML=p.mbti?'<span class="prof-mbti-badge">'+p.mbti+'</span>':'';
  document.getElementById('prof-bio').textContent=p.bio||'';
  // info boxes
  var infos=[];
  if(p.birth){ var b=new Date(p.birth); var age=new Date().getFullYear()-b.getFullYear(); infos.push({l:'생년월일',v:p.birth+' (만 '+age+'세)'}); }
  if(p.blood)  infos.push({l:'혈액형',v:p.blood});
  if(p.height) infos.push({l:'키',v:p.height+' cm'});
  if(p.weight) infos.push({l:'몸무게',v:p.weight+' kg'});
  if(p.school) infos.push({l:'학교',v:p.school});
  if(p.grade)  infos.push({l:'학년/반',v:p.grade});
  if(p.addr)   infos.push({l:'주소',v:p.addr});
  if(p.phone)  infos.push({l:'연락처',v:p.phone});
  var grid=document.getElementById('prof-info-grid');
  grid.innerHTML=infos.length
    ? infos.map(function(x){ return '<div class="info-box"><div class="info-lbl">'+x.l+'</div><div class="info-val">'+esc(x.v)+'</div></div>'; }).join('')
    : '<div style="grid-column:span 2;text-align:center;padding:14px;color:var(--textl);font-family:Gaegu,sans-serif;font-weight:700;font-size:14px">프로필을 수정해서 나를 소개해봐요! 🌸</div>';
  // hobby tags
  var tags=[
    {t:'🎹 피아노',c:'linear-gradient(135deg,#FF8FAB,#FF9ABB)'},
    {t:'🎨 미술',c:'linear-gradient(135deg,#C3A4FF,#D4A5FF)'},
    {t:'🏊 수영',c:'linear-gradient(135deg,#6EC9F5,#8DD8FF)'},
    {t:'🌍 영어',c:'linear-gradient(135deg,#5ED9B8,#7AE8CC)'}
  ];
  var hWrap=document.getElementById('prof-hobbies');
  if(p.name){
    hWrap.innerHTML=tags.map(function(tag){ return '<span class="hobby-tag" style="background:'+tag.c+'">'+tag.t+'</span>'; }).join('');
    if(p.bio) hWrap.innerHTML+='<p style="width:100%;margin-top:10px;font-size:13px;color:var(--textm);font-family:Gaegu,sans-serif;font-weight:700;line-height:1.5">'+esc(p.bio)+'</p>';
  } else {
    hWrap.innerHTML='<span style="font-size:14px;color:var(--textm);font-family:Gaegu,sans-serif;font-weight:700">프로필을 입력하면 여기에 표시돼요!</span>';
  }
}

/* ════════════════════════════════════
   TABLET LAYOUT ENHANCEMENT
════════════════════════════════════ */
function applyLayout(){
  var w = window.innerWidth;
  var wrap = document.getElementById('home-grid-wrap');
  var taskCard = document.getElementById('task-card');
  var moodCard = document.getElementById('mood-card');
  if(!wrap || !taskCard || !moodCard) return;

  if(w >= 768){
    // tablet: show task + mood side by side
    wrap.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:16px;';
    // remove the sec label gap for mood card since it's in grid
    taskCard.style.marginBottom = '0';
    moodCard.style.marginBottom = '0';
  } else {
    wrap.style.cssText = 'display:contents';
    taskCard.style.marginBottom = '';
    moodCard.style.marginBottom = '';
  }
}

applyLayout();
window.addEventListener('resize', applyLayout);
window.addEventListener('orientationchange', function(){ setTimeout(applyLayout, 200); });

load();
initHome();
renderCalendar();
renderProfile();
</script>
